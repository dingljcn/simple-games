<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>行动代号</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header>
        <span>房间：<span id="roomDisplay"></span></span>
        <span>状态：<span id="stateDisplay"></span></span>
        <span id="userInfo"></span>
        <span id="timeDisplay"></span>
    </header>
    <div id="errorToast"></div>

    <!-- 分组视图 -->
    <div id="groupingView">
        <h2>房间配置</h2>
        <div id="configDisplay" class="config-display"></div>
        <h2>玩家列表</h2>
        <div id="teamsContainer" class="teams"></div>
        <div id="spectatorsContainer" class="spectators"></div>
        <div class="actions">
            <button id="readyBtn">准备</button>
            <button id="startBtn">开始游戏</button>
            <button id="leaveBtn">离开房间</button>
            <button id="dissolveBtn" class="danger">解散房间</button>
        </div>
    </div>

    <!-- 游戏视图 -->
    <div id="gameView" style="display:none">
        <div id="board" class="board"></div>
        <div class="game-info" id="gameInfo"></div>
        <div id="actionButtons">
            <button id="revealBtn" style="display:none">对 / 错</button>
            <button id="endTurnBtn" style="display:none">结束行动</button>
            <button id="regroupBtn" style="display:none">重新分组</button>
            <button id="restartBtn" style="display:none">重开一局</button>
        </div>
    </div>

    <!-- 游戏结束视图 -->
    <div id="gameOverView" style="display:none">
        <h2 id="winnerText"></h2>
        <div id="endBoard" class="board"></div>
        <div class="actions">
            <button id="discardBtn">弃用选中词汇</button>
            <button id="leaveEndBtn">离开房间</button>
            <button id="regroupEndBtn" style="display:none">重新分组</button>
            <button id="restartEndBtn" style="display:none">重开一局</button>
            <button id="readyEndBtn">准备</button>
        </div>
    </div>
</div>

<!-- 交换请求弹窗 -->
<div id="swapModal" style="display:none">
    <p id="swapText"></p>
    <button id="swapAccept">同意</button>
    <button id="swapReject">拒绝</button>
</div>

<!-- 确认弹窗 -->
<div id="confirmModal" style="display:none">
    <p id="confirmText"></p>
    <button id="confirmYes">确认</button>
    <button id="confirmNo">取消</button>
</div>

<!-- 房主发起的行动确认弹窗 -->
<div id="pendingModal" style="display:none">
    <p id="pendingText"></p>
    <button id="pendingAgree">同意</button>
    <button id="pendingReject">拒绝</button>
</div>

<script src="app.js"></script>
</body>
</html>
